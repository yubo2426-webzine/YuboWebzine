<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전북 꼬마 탐험대</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&display=swap">
<style>
html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
/* 레이아웃: 휴대폰 세로 한 화면. 위에 얇은 상태 줄, 아래에 화면 하나씩 갈아 끼우는 90년대 휴대용 게임기 구성 */
:root{
  color-scheme:dark;
  --ink:#14152b; --night:#23265a; --line:#0a0b18;
  --paper:#f6ecd0; --paper-ink:#2a2338; --dim:#9aa0cc;
  --sun:#ffcd38; --coral:#ff6b5c; --leaf:#5fd068; --sky:#58b7f0;
  --hist:#d9963f; --nat:#4fb866; --play:#ef6477; --health:#4a93e6; --crea:#a873e8;
  --kr:'Do Hyeon','Galmuri11','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --px:'Press Start 2P','Do Hyeon',monospace;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--kr);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#app{height:100%;max-width:460px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:8px;padding-block:8px;border-bottom:3px solid var(--night);min-height:50px}
#bar[hidden]{display:none}
#bt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:18px}
.ib{font:inherit;font-size:14px;background:var(--night);color:var(--paper);border:2px solid var(--line);padding:6px 10px;min-height:36px}
#screen{flex:1;min-height:0;overflow-y:auto;padding-block:14px 22px;display:flex;flex-direction:column;gap:14px}
h1,h2,p{margin:0}
h2{font-size:22px;font-weight:400;text-wrap:balance}
.btn{font:inherit;font-size:19px;background:var(--sun);color:var(--paper-ink);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);padding:11px 14px;width:100%;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--paper)}
.btn.dark{background:var(--night);color:var(--paper)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.dimtxt{color:var(--dim);font-size:15px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}

/* 타이틀 */
.title{align-items:center;text-align:center;gap:16px;padding-top:10px}
.eyebrow{font-family:var(--px);font-size:9px;letter-spacing:.12em;color:var(--sky)}
.logo{font-size:54px;line-height:1.05;font-weight:400;color:var(--sun);text-shadow:4px 4px 0 var(--coral),8px 8px 0 var(--line)}
.trio{display:flex;justify-content:center;gap:6px;background:var(--night);border:3px solid var(--line);padding:8px 10px;width:100%}

/* 종이 상자 (대화창, 카드) */
.box{background:var(--paper);color:var(--paper-ink);border:3px solid var(--line);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--paper-ink);padding:16px}
.box b{font-weight:400;color:var(--coral)}
.pick{font:inherit;text-align:left;background:var(--night);color:var(--paper);border:3px solid var(--line);padding:12px;display:flex;gap:12px;align-items:center;width:100%;cursor:pointer}
.pick[aria-pressed="true"]{background:var(--paper);color:var(--paper-ink);box-shadow:0 0 0 3px var(--sun)}
.pick small{display:block;font-size:14px;opacity:.8}
.pick>span{flex:1;min-width:0}
input.txt{font:inherit;font-size:22px;width:100%;padding:12px;background:var(--paper);color:var(--paper-ink);border:3px solid var(--line);text-align:center}

/* 지도 */
.me{display:flex;align-items:center;gap:10px;background:var(--night);border:3px solid var(--line);padding:6px 10px}
.me>div{flex:1;min-width:0}
.lv{font-family:var(--px);font-size:11px;color:var(--sun)}
.mapwrap{position:relative;border:3px solid var(--line);background:var(--line)}
.mapwrap canvas{display:block;width:100%;height:auto}
.ml{position:absolute;transform:translate(-50%,-50%);font:inherit;font-size:12px;line-height:1;padding:3px 2px;background:none;border:0;color:var(--dim);white-space:nowrap}
.ml.open{background:var(--paper);color:var(--paper-ink);border:2px solid var(--line);font-size:15px;padding:4px 6px;box-shadow:0 3px 0 var(--line);cursor:pointer;animation:hop 1s steps(2) infinite}
@keyframes hop{50%{margin-top:-3px}}
@media (prefers-reduced-motion:reduce){.ml.open{animation:none}}

/* 체험장 카드 */
.stg{font:inherit;text-align:left;background:var(--night);color:var(--paper);border:3px solid var(--line);border-left-width:10px;padding:10px 12px;width:100%;display:flex;align-items:center;gap:10px;cursor:pointer}
.stg>span{flex:1;min-width:0}
.stg small{display:block;font-size:14px;color:var(--dim)}
.stars{font-size:18px;color:var(--sun);letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;opacity:.25}
.chip{display:inline-block;font-size:13px;padding:1px 6px;color:var(--line);margin-right:4px}
.hist{--d:var(--hist)}.nat{--d:var(--nat)}.play{--d:var(--play)}.health{--d:var(--health)}.crea{--d:var(--crea)}
.stg{border-left-color:var(--d)}.chip{background:var(--d)}
.badge{width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--d);color:var(--line);font-size:22px;border:3px solid var(--line);box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.35);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.badge.off{background:var(--night);color:var(--dim);box-shadow:none}
.badges{display:flex;gap:6px;flex-wrap:wrap}

/* 게임 */
.hud{display:flex;justify-content:space-between;gap:8px;font-size:16px}
.hud b{font-family:var(--px);font-size:13px;color:var(--sun);font-weight:400}
#gc{display:block;margin:0 auto;width:min(100%,calc((100dvh - 215px)*.75));aspect-ratio:3/4;max-width:100%;border:3px solid var(--line);box-shadow:0 0 0 3px var(--night);touch-action:none;background:#000}
.hint{text-align:center;font-size:16px;color:var(--dim)}
.big{font-family:var(--px);font-size:30px;color:var(--sun);text-align:center;letter-spacing:4px}
.big i{font-style:normal;opacity:.2}
.center{text-align:center;align-items:center}
.stat{display:grid;grid-template-columns:5.2em 1fr 2.4em;gap:8px;align-items:center;font-size:15px}
.stat .tr{height:12px;background:var(--line);border:2px solid var(--line)}
.stat .fi{height:100%;background:var(--d)}
.stat span:last-child{font-family:var(--px);font-size:10px;text-align:right}
.info{font-size:15px;display:grid;grid-template-columns:4em 1fr;gap:3px 8px}
.info dt{color:var(--coral)}.info dd{margin:0;min-width:0;overflow-wrap:anywhere;user-select:text}
.info a{color:#1d5fae}
.code{font-family:var(--px);font-size:16px;line-height:1.8;overflow-wrap:anywhere;text-align:center;letter-spacing:2px;padding:14px 4px;user-select:all}
.rk{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:16px}.rk li{display:grid;grid-template-columns:2em 1fr auto;gap:8px;padding:4px 8px;font-variant-numeric:tabular-nums}.rk li.me{background:var(--sun)}.rk li span:first-child{color:var(--coral)}.rk li span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.row>.btn{font-size:16px;padding-inline:6px}
.flash{animation:fl .25s steps(2) 6}
@keyframes fl{50%{filter:brightness(4) saturate(0)}}
</style>

</head>

const RKEY='jb-explorer-rank-v1';
function rankLoad(){try{return JSON.parse(localStorage.getItem(RKEY))||{}}catch(e){return{}}}
function rankAdd(id,score){const R=rankLoad(),L=R[id]||[],me=L.find(x=>x.n===S.nick);let best=false;
  if(me){if(score>me.s){me.s=score;me.d=Date.now();best=true}}else{L.push({n:S.nick,s:score,d:Date.now()});best=true}
  L.sort((a,b)=>b.s-a.s||a.d-b.d);R[id]=L.slice(0,20);try{localStorage.setItem(RKEY,JSON.stringify(R))}catch(e){}return best}
const rankHtml=(s,n)=>{const L=(rankLoad()[s.id]||[]).slice(0,n);if(!L.length)return'<p>아직 기록이 없어요.</p>';
  return'<ol class="rk">'+L.map((x,i)=>`<li class="${x.n===S.nick?'me':''}"><span>${i+1}위</span><span>${esc(x.n)}</span><span>${x.s}${s.unit[1]}</span></li>`).join('')+'</ol>'};

/* ───────── 소리 ───────── */
let AC=null,snd=true;
function beep(f,d=.07){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function sfx(f){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();f(AC,AC.currentTime)}catch(e){}}
function drum(k){sfx((A,t)=>{const g=A.createGain(),o=A.createOscillator();
  if(k==='R'){o.type='square';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(380,t+.06);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.09)}
  else{o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(55,t+.28);g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.001,t+.32)}
  o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+.34)});if(k==='B')drum('R')}
function tone(f,d,v){sfx((A,t)=>{const g=A.createGain(),o=A.createOscillator();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+(d||.35));o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+(d||.35)+.02)})}
function jingle(a){a.forEach((f,i)=>setTimeout(()=>beep(f,.11),i*110))}

/* ───────── 캐릭터 그리기 (24칸 격자) ───────── */
function drawChar(c,ox,oy,u,ci,st,doms,t){
  const p=CH[ci];const bob=Math.sin(t*4)>0?0:1;
  const R=(x,y,w,h,col,fix)=>{c.fillStyle=col;c.fillRect(Math.round(ox+x*u),Math.round(oy+(y+(fix?0:bob*.5))*u),Math.ceil(w*u),Math.ceil(h*u))};
  const has=k=>doms.indexOf(k)>=0;
  const bw=[8,10,12,14][st],bh=[8,10,12,13][st],bx=12-bw/2,by=21-bh,mid=by+Math.floor(bh/2);
  R(bx,22,bw,1,'rgba(0,0,0,.35)',1);
  if(st===3){const a=Math.floor(t*3)%2;[[2,6],[21,8],[4,17],[20,18],[12,by-6]].forEach((q,i)=>{if((i+a)%2)R(q[0],q[1],1,1,'#ffe98a',1)})}
  if(st>=2){R(bx-2,by+3,bw+4,bh-4,'#b3364a');R(bx-3,by+bh-3,bw+6,2,st===3?'#ffd23f':'#8a2637')}
  R(bx-1,by+1,bw+2,bh-2,p.k);R(bx+1,by-1,bw-2,bh+2,p.k);R(bx,by,bw,bh,p.b);
  R(bx+2,mid,bw-4,Math.ceil(bh/2)-1,p.l);
  // 귀·더듬이·뿔
  if(p.e===0){[bx,bx+bw-3].forEach(x=>{R(x,by-2-st,3,3+st,p.k);R(x+1,by-1-st,1,2+st,p.b)})}
  else if(p.e===1){[bx+1,bx+bw-2].forEach(x=>{R(x,by-3-st,1,3+st,p.k);R(x-.5,by-5-st,2,2,'#ffe066')})}
  else{[bx+1,bx+bw-3].forEach(x=>{R(x,by-2,2,2,p.k);R(x+.5,by-3-st,1,2+st,'#fff2c0')})}
  const ey=by+2+(st>1?1:0);
  [bx+1,bx+bw-3].forEach(x=>{R(x,ey,2,2,'#1a1a2a');R(x,ey,1,1,'#fff')});
  if(st>=2){R(bx+1,ey-1,3,1,p.k);R(bx+bw-4,ey-1,3,1,p.k)}else{R(bx,ey+2,1,1,'#f59aa0');R(bx+bw-1,ey+2,1,1,'#f59aa0')}
  R(11,ey+3,2,1,p.k);
  if(st>=1){const ah=st>=2?4:3;R(bx-2,mid-1,2,ah,p.k);R(bx+bw,mid-1,2,ah,p.k);R(bx+bw+1,by+bh-4,1+st,2,p.k)}
  R(bx+1,21,3,1,p.k);R(bx+bw-4,21,3,1,p.k);
  if(st===3)R(11,mid+1,2,2,'#ffd23f');
  // 영역 장식
  if(has('play')){const sy=ey+4;R(bx-1,sy,bw+2,1,'#e23d4f');R(bx+bw-2,sy+1,2,2,'#e23d4f')}
  if(has('health')){R(bx-5,by+bh-7,4,5,'#3f86d8');R(bx-4,by+bh-2,2,1,'#3f86d8');R(bx-4,by+bh-5,2,1,'#fff');R(bx-3.5,by+bh-6,1,3,'#fff')}
  if(has('nat')){R(bx+bw+1,by+1,2,3,'#3fae4f');R(bx+bw+2,by,1,1,'#7be07f');if(Math.sin(t*6)>0)R(bx+bw+3,by+2,1,1,'#fff59a')}
  if(has('hist')){R(bx-1,by-1,bw+2,1,'#1c1c24');R(9,by-4,6,3,'#1c1c24');R(9,by-2,6,1,'#c33')}
  if(has('crea')){const sy=by-8-(has('hist')?1:0)+(bob?0:.5);R(11,sy+1,3,1,'#ffd23f',1);R(12,sy,1,3,'#ffd23f',1)}
}

/* ───────── 전북 지도 ───────── */
const MAP=['..GGIIWW...UU.','.GGGIIWWWAAUUU','..GKIIWWWAAUUU','..KKKJJWWAAAUU','.BKKKJJWMAASS.','BBBKZZMMMAASS.','.BBZZZMMMSSS..','..CZZZNMMRSS..','.CCCZNNNRRR...','.CCC.NNNRRR...','..CC..N.RR....'];
const RG={G:['군산','gs'],I:['익산','is'],W:['완주','wj'],J:['전주','jj'],K:['김제','gj'],B:['부안','ba'],Z:['정읍','je'],M:['임실','im'],A:['진안','ja'],U:['무주','mj'],S:['장수','js'],C:['고창','gc'],N:['순창','sc'],R:['남원','nw']};
const OPENCOL=['#ffcd38','#ff8f66','#7fd08a','#6fb7f0','#f29ac0','#c9a0f0'];
function drawMap(cv){const c=cv.getContext('2d'),u=20,R=(x,y,w,h,k)=>{c.fillStyle=k;c.fillRect(x,y,w,h)};
  R(0,0,280,220,'#1d2f5c');for(let i=0;i<60;i++)R((i*47)%280,(i*29)%220,4,1,'#2b4480');
  const lock=['#4b4f74','#575b83','#444869'],keys=Object.keys(RG);
  const at=(x,y)=>MAP[y]&&MAP[y][x]&&MAP[y][x]!=='.'?MAP[y][x]:null;
  MAP.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='.')return;const r=RG[ch][1];
    let col=lock[keys.indexOf(ch)%3];if(isOpen(r))col=OPENCOL[keys.indexOf(ch)%OPENCOL.length];
    R(x*u,y*u,u,u,col);R(x*u+((x*7+y*3)%13),y*u+((x*5+y*11)%15),2,2,'rgba(255,255,255,.14)');
    if(at(x+1,y)!==ch)R(x*u+u-2,y*u,2,u,at(x+1,y)?'#0a0b18':'#d7e7ff');
    if(at(x,y+1)!==ch)R(x*u,y*u+u-2,u,2,at(x,y+1)?'#0a0b18':'#d7e7ff');
    if(!at(x-1,y))R(x*u,y*u,2,u,'#d7e7ff');if(!at(x,y-1))R(x*u,y*u,u,2,'#d7e7ff')}))}
function map(){
  const lab=Object.keys(RG).map(k=>{let sx=0,sy=0,n=0;MAP.forEach((row,y)=>[...row].forEach((c,x)=>{if(c===k){sx+=x+.5;sy+=y+.5;n++}}));
    const r=RG[k][1],op=r&&isOpen(r);
    return`<button class="ml ${op?'open':''}" style="left:${sx/n/14*100}%;top:${sy/n/11*100}%" data-r="${r||''}" data-n="${RG[k][0]}">${RG[k][0]}</button>`}).join('');

   <div class="row"><button class="btn alt" data-a="me">내 캐릭터</button><button class="btn alt" data-a="dex">수첩</button><button class="btn alt" data-a="code">저장</button>${S.mode==='adult'?'<button class="btn alt" data-a="rk">랭킹</button>':''}</div>`,'전북 지도',title);
  drawMap($('#mp'));
  on('.ml',el=>{const r=el.dataset.r;if(r&&isOpen(r))region(r);else $('#mh').textContent=REGION[r].n+': '+REGION[r].pre.map(p=>REGION[p].n).join(' 또는 ')+'에서 뱃지 3개를 모으면 열려요'});
  on('[data-a]',el=>({me:()=>status(map),dex:()=>dex(map),code:()=>codeOut(map),rk:()=>rankScreen(map)})[el.dataset.a]());

function intro(s){
  const kid=S.mode==='kid',th=kid?s.kid:s.adult,u=s.unit[1];
  show(`<div class="row" style="align-items:center"><span class="badge ${s.dom}" style="flex:none">${DOM[s.dom].g}</span><div><span class="chip ${s.dom}">${DOM[s.dom].n}</span><h2>${s.title}</h2></div></div>
   <div class="box col"><p>${s.hint}.</p>
    <p>★ ${th[0]}${u} · ★★ ${th[1]}${u} · ★★★ ${th[2]}${u}</p>
    <p>${kid?'끝까지 하면 별 1개는 꼭 받아요.':`<b>${s.rival}</b>의 기록은 ${th[1]}${u}. 제한 시간은 ${s.time||30}초예요.`}</p>${kid?'':(()=>{const t=(rankLoad()[s.id]||[])[0];return t?`<p>이 기기 1위: <b>${esc(t.n)}</b> ${t.s}${u}</p>`:''})()}</div>
   <button class="btn" id="go">도전!</button>
   <p class="dimtxt">${s.place}에서 실제로 할 수 있는 체험을 본떠 만든 놀이예요.</p>`,s.place,()=>region(s.r));
  on('#go',()=>play(s));
}

  show(`<div class="hud"><span>${s.unit[0]} <b id="hs">0</b> ${s.unit[1]}</span><span>${kid?'':'라이벌 <b>'+th[1]+'</b>'}</span><span>시간 <b id="ht">0</b></span></div>
   <canvas id="gc" width="180" height="240"></canvas><p class="hint">${s.hint}</p>`,s.title,()=>region(s.r));
  const cv=$('#gc'),K=Math.max(2,Math.min(6,Math.round((cv.getBoundingClientRect().width||360)*(window.devicePixelRatio||1)/180)));cv.width=180*K;cv.height=240*K;const c=cv.getContext('2d');c.setTransform(K,0,0,K,0,0);
  const G={c,kid,score:0,time:s.time||30,over:false,t:0,msg:'',mt:0,dn:false,say(m){G.msg=m;G.mt=.9},pen(n){if(!kid)G.time=Math.max(0,G.time-n)}};
  const g=GAMES[s.game](G,s.v||{}),D=mk(G);

  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*180,(e.clientY-r.top)/r.height*240]};
  cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}if(pre>0||!alive)return;G.dn=true;const p=pos(e);g.down&&g.down(p[0],p[1])};
  cv.onpointermove=e=>{if(pre>0||!G.dn||!alive)return;const p=pos(e);g.move&&g.move(p[0],p[1])};
  cv.onpointerup=cv.onpointercancel=()=>{G.dn=false};
  const hs=$('#hs'),ht=$('#ht');
  (function frame(now){
    if(!cv.isConnected)return;
    const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
    if(pre>0)pre-=dt;else if(alive){G.t+=dt;G.time-=dt;g.update(dt);if(G.mt>0)G.mt-=dt}
    c.globalAlpha=1;g.draw();
    if(G.mt>0)D.T(G.msg,90,26,13,'#ffd23f');
    if(pre>0){D.R(0,100,180,40,'rgba(10,11,24,.8)');D.T(pre>.5?'준비':'시작!',90,121,20,'#ffd23f')}
    hs.textContent=G.score;ht.textContent=Math.max(0,Math.ceil(G.time));

    requestAnimationFrame(frame)})(last);
}

 lane(G,v){const{R,T,E}=mk(G),c=G.c,LX=[45,90,135];let ln=1,O=[],nt=.6,hit=0,d=0,sp=G.kid?70:110;

 dash(G,v){const{R,T,E}=mk(G),c=G.c,sp=G.kid?46:62;let x=0,F=[],wet=0,nf=70;
  const add=()=>{F.push({x:nf,per:G.kid?rnd(2.6,3.4):rnd(1.6,2.6),ph:rnd(0,3),p:0});nf+=rnd(60,90)};for(let i=0;i<4;i++)add();

   draw(){R(0,0,180,240,v.sky);R(0,186,180,54,v.gnd);const cam=x-40;for(let i=0;i<6;i++)R(((i*50-x*.4)%300+300)%300-40,60+(i%2)*14,30,7,'rgba(255,255,255,.8)');

    if(!(wet>0&&Math.floor(G.t*16)%2)){c.save();c.translate(40,172+(G.dn?Math.sin(G.t*18)*1.5:0));c.scale(-1,1);E(v.e,0,0,24);c.restore()}T('꾹 누르면 달리고, 떼면 멈춰요',90,228,10)}}},

 frog(G,v){const{R,T}=mk(G),L=[];let st=0,arr=0;
  for(let i=0;i<4;i++){const vv=(i%2?-1:1)*(G.kid?34:58)*rnd(.8,1.3);for(let j=0;j<(G.kid?1:2);j++)L.push({i,y:164-i*30,v:vv,x:rnd(0,90)+j*140,k:['#e2574c','#4c8be2','#f2b233','#7fd08a'][i]})}
  return{update(dt){if(arr>0){arr-=dt;if(arr<=0)st=0}L.forEach(l=>{l.x+=l.v*dt;if(l.x>230)l.x=-50;if(l.x<-50)l.x=230;if(st===l.i+1&&arr<=0&&l.x<102&&l.x+26>78){st=G.kid?Math.max(0,st-1):0;G.pen(2);G.say('차 조심! 좌우를 살펴요');beep(160)}})},
   down(){if(arr>0)return;st++;beep(520,.03);if(st>=5){G.score++;arr=.5;G.say('안전하게 건넜어요!');beep(880)}},
   draw(){R(0,0,180,240,'#8fcf7a');R(0,24,180,22,'#d9d2c0');R(0,46,180,140,'#4a4d5c');R(0,186,180,26,'#d9d2c0');for(let i=0;i<8;i++)R(68,50+i*17,44,8,'#f1f1f1');
    L.forEach(l=>{R(l.x,l.y-6,26,12,l.k);R(l.x+(l.v>0?14:4),l.y-9,9,4,'#cfe6f5');R(l.x+3,l.y+5,5,3,'#111');R(l.x+18,l.y+5,5,3,'#111')});
    const py=st===0?200:st>=5?36:164-(st-1)*30;drawChar(G.c,71,py-27,1.6,S.ch,evoOf(clears()),domStr(),G.t);T('차가 없을 때 눌러 한 칸씩',90,229,10)}}},

 steps(G,v){const{R,T,E}=mk(G);let Q=[],shake=0,off=0,side=0;for(let i=0;i<7;i++)Q.push(ri(0,1));
  return{update(dt){shake-=dt;off=Math.max(0,off-dt*150)},
   down(x){const s=x<90?0:1;if(s===Q[0]){side=s;Q.shift();Q.push(ri(0,1));G.score++;off=28;beep(500+s*200,.03)}else{shake=.35;G.pen(2);G.say('발판이 있는 쪽을 눌러요');beep(170)}},
   draw(){R(0,0,180,240,v.sky);R(0,0,26,240,v.gnd);R(154,0,26,240,v.gnd);R(40,0,2,240,'#7a5a32');R(138,0,2,240,'#7a5a32');
    Q.forEach((s,i)=>{const y=170-i*28-off;R(s?94:42,y,44,10,'#a9703c');R(s?94:42,y,44,2,'#c98d52')});R(side?94:42,198-off*.0,44,10,'#8a5a2b');
    E(v.e,(side?116:64)+(shake>0?Math.sin(G.t*60)*4:0),186,26);T('◀ 왼쪽',30,228,11);T('오른쪽 ▶',148,228,11)}}},

 read(G,v){const{R,T,E}=mk(G),c=G.c;let val,opts,na=0;
  const fresh=()=>{val=G.kid?ri(2,8)*5:ri(11,44);const st=G.kid?5:ri(1,3);let k=ri(0,2);while(val-k*st<5)k--;opts=[0,1,2].map(i=>val+(i-k)*st)};fresh();
  return{update(dt){na+=(val-na)*Math.min(1,dt*7)},
   down(x,y){if(y<160||y>214)return;const i=Math.min(2,Math.floor(x/60));if(opts[i]===val){G.score++;beep(880);G.say('정답!');fresh()}else{G.pen(2);G.say('눈금을 다시 봐요');beep(170)}},
   draw(){R(0,0,180,240,v.bg);const cx=90,cy=126,r=64;R(cx-r-4,cy-r-4,2*r+8,r+18,'#0a0b18');R(cx-r,cy-r,2*r,r+10,'#fff7df');
    for(let k=0;k<=50;k+=G.kid?5:1){const a=Math.PI+k/50*Math.PI,l=k%10===0?10:k%5===0?7:3;c.strokeStyle='#2a2338';c.lineWidth=k%5===0?2:1;c.beginPath();c.moveTo(cx+Math.cos(a)*(r-4),cy+Math.sin(a)*(r-4));c.lineTo(cx+Math.cos(a)*(r-4-l),cy+Math.sin(a)*(r-4-l));c.stroke();if(k%10===0)T(String(k),cx+Math.cos(a)*(r-23),cy+Math.sin(a)*(r-23),9,'#2a2338')}

 follow(G,v){const{R,T,E}=mk(G),tol=G.kid?16:9,sp=G.kid?34:56;let x=90,d=0,acc=0,off=0;

/* ───────── 결과 · 성장 ───────── */
function result(s,score){
  const kid=S.mode==='kid',th=kid?s.kid:s.adult,u=s.unit[1];
  let st=score>=th[2]?3:score>=th[1]?2:score>=th[0]?1:0;if(kid&&st<1)st=1;
  const had=S.stars[s.id]||0,ev0=evoOf(clears()),op0=Object.keys(REGION).filter(isOpen),d0=domStr(),lv0=level();
  if(st>had){S.stars[s.id]=st;save()}
  const nb=!kid&&score>0?rankAdd(s.id,score):false;
  const ev1=evoOf(clears()),first=!had&&st>0,newAcc=first&&d0.indexOf(s.dom)<0,opened=Object.keys(REGION).filter(k=>isOpen(k)&&!op0.includes(k)).map(k=>REGION[k].n).join(', ');
  if(st)jingle(st===3?[660,880,990,1320]:[660,880]);else beep(150,.3);
  const nx=()=>{if(ev1>ev0||opened)evolve(ev0,d0,opened,s.r);else region(s.r)};
  show(`<div class="col center"><h2>${st?(first?'통과!':'도전 완료'):'아쉬워요'}</h2><p class="big">${starTxt(st)}</p>
    <p>${s.unit[0]} ${score}${u}${!kid&&st?(score>=th[1]?' · '+s.rival+'을 이겼어요':' · 라이벌 기록 '+th[1]+u):''}</p></div>
   ${kid?'':`<div class="box col"><p><b>이 기기 랭킹</b>${nb?' · 내 최고 기록!':''}</p>${rankHtml(s,5)}</div>`}
   ${st?'':`<div class="box"><p>별 1개는 ${th[0]}${u}부터예요. 한 번 더 해 볼까요?</p></div>`}
   ${first?`<div class="box col"><div class="row" style="align-items:center"><span class="badge ${s.dom}" style="flex:none">${DOM[s.dom].g}</span><p><b>${DOM[s.dom].n} 뱃지</b>를 받았어요.<br>Lv.${lv0} → Lv.${level()} · ${DOM[s.dom].st} +${st*6}</p></div>
     ${newAcc?`<p>${CH[S.ch].n}에게 <b>${DOM[s.dom].acc}</b>이(가) 생겼어요.</p>`:''}</div>
    `:''}
   <div class="box col"><p><b>시설 안내</b>${first?' · 탐험 수첩에 기록했어요':''}</p><dl class="info"><dt>이름</dt><dd>${s.place}</dd>${INFO[s.id]?`<dt>주소</dt><dd>${INFO[s.id][0]}</dd><dt>전화</dt><dd>${INFO[s.id][1]}</dd>`:'<dt>안내</dt><dd>업로드한 목록에 없는 장소라 주소와 전화번호가 없어요.</dd>'}<dt>체험</dt><dd>${s.prog}</dd></dl></div>
   <div class="row"><button class="btn alt" id="re">다시 도전</button>${st||had?'<button class="btn" id="nx">계속</button>':''}</div>`,s.title,st||had?nx:()=>region(s.r));
  on('#re',()=>play(s));on('#nx',nx);
}
function evolve(ev0,d0,opened,r){
  const ev1=evoOf(clears()),changed=ev1>ev0,name=CH[S.ch].n;
  show(`<div class="col center"><p class="eyebrow">${changed?'GROW UP':'NEW ROUTE'}</p>
    <div class="trio">${chr(5,S.ch,ev0,d0)}</div>
    <h2 id="et">${changed?`뱃지의 힘이 ${name}에게 모이고 있어요`:'새로운 길이 열렸어요'}</h2></div>
   <div id="ex" class="col" hidden>
    ${changed?`<div class="box col"><p><b>${FORM[ev1]}</b> ${name} · Lv.${level()}</p>${statHtml()}</div>`:''}
    ${opened?`<div class="box"><p><b>${opened}</b>(으)로 가는 길이 열렸어요!</p></div>`:''}
    <button class="btn" id="go">${opened?'지도 보기':'계속'}</button></div>`,changed?'성장':'새 지역',null);
  const cv=scr.querySelector('canvas.chr'),fin=()=>{cv.dataset.st=ev1;cv.dataset.d=domStr();cv.classList.remove('flash');tickChr();
    if(changed)$('#et').textContent=`${name}가 ${FORM[ev1]}(으)로 자랐어요!`;$('#ex').hidden=false;jingle([523,659,784,1047])};
  if(changed){cv.classList.add('flash');jingle([330,392,494]);setTimeout(()=>{if(cv.isConnected)fin()},1500)}else fin();
  on('#go',()=>opened?map():region(r));
}
const statHtml=()=>DK.map(k=>{const v=stat(k);return`<div class="stat ${k}"><span>${DOM[k].st}</span><div class="tr"><div class="fi" style="width:${Math.min(100,v/(107+18*STAGES.filter(s=>s.dom===k).length)*100)}%"></div></div><span>${v}</span></div>`}).join('');
function status(bk){
  const n=clears(),ev=evoOf(n),nxt=EVO_AT[ev],ds=domStr();
  show(`<div class="trio">${myChr(6)}</div>
   <div class="col center"><h2>${esc(S.nick)}의 ${CH[S.ch].n}</h2><p><span class="lv">Lv.${level()}</span> · ${FORM[ev]}</p></div>
   <div class="box col">${statHtml()}</div>
   <div class="box col"><p>${nxt?`뱃지를 ${nxt-n}개 더 모으면 <b>${FORM[ev+1]}</b>(으)로 자라요.`:'가장 강한 모습까지 자랐어요.'}</p>
    <p>장식: ${ds?ds.split(',').map(k=>DOM[k].acc).join(', '):'아직 없어요. 영역을 통과하면 생겨요.'}</p></div>`,'내 캐릭터',bk);
}
function dex(bk){
  show(`<p class="dimtxt">통과한 체험 장소 ${clears()} / ${STAGES.length}곳</p>
   ${STAGES.map(s=>S.stars[s.id]?`<div class="box col"><p><span class="chip ${s.dom}">${DOM[s.dom].n}</span>${REGION[s.r].n} <span class="stars" style="color:var(--coral)">${'★'.repeat(S.stars[s.id])}</span><br>${s.place}</p>${infoHtml(s)}</div>`
     :`<div class="stg ${s.dom}" style="cursor:default"><span>???<small>${REGION[s.r].n} · ${DOM[s.dom].n}</small></span></div>`).join('')}`,'탐험 수첩',bk);
}
function codeOut(bk){
  save();const code=mkCode();
  show(`<h2>이어하기 코드</h2><div class="box col"><p class="code" id="cd">${code}</p><p>이 기기에는 자동으로 저장돼요. 다른 휴대폰이나 다른 앱에서 이어 하려면 이 코드를 적어 두세요.</p></div>
   <button class="btn" id="cp">코드 복사</button><p class="dimtxt">코드에는 모드, 캐릭터, 별 기록이 담겨요. 이름은 다시 적어야 해요.</p>`,'저장',bk);
  on('#cp',el=>{const done=()=>el.textContent='복사했어요';try{navigator.clipboard.writeText(code).then(done,()=>{el.textContent='코드를 길게 눌러 복사해 주세요'})}catch(e){el.textContent='코드를 길게 눌러 복사해 주세요'}});
}
function codeIn(){
  show(`<h2>적어 둔 코드를 넣어 주세요</h2>
   <input class="txt" id="ci" maxlength="48" placeholder="ABCD-EFGH" autocomplete="off" autocapitalize="characters" style="font-family:var(--px);font-size:13px">
   <input class="txt" id="cn" maxlength="8" placeholder="탐험가 이름" autocomplete="off">
   <p class="dimtxt" id="ce" aria-live="polite">적어 둔 코드를 그대로 넣어 주세요.</p><button class="btn" id="go">이어하기</button>`,'코드로 이어하기',title);
  on('#go',()=>{const r=readCode($('#ci').value);if(!r){$('#ce').textContent='코드가 맞지 않아요. 글자를 다시 확인해 주세요. 숫자 0, 1과 알파벳 I, O는 쓰지 않아요.';beep(170);return}
    S={nick:$('#cn').value.trim()||'탐험가',ch:r.ch,mode:r.mode,stars:r.stars};save();map()});
}

/* ───────── 시작 ───────── */
function boot(d){if(d&&d.S&&d.S.nick){S=d.S;map()}else title()}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data||{});
</script>
